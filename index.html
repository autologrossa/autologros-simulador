<!DOCTYPE html>
<html lang="es-AR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AUTOLOGROS · Simulador de crédito prendario</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --paper:#EDF0F4; --panel:#FFFFFF; --ink:#16202E; --muted:#5B6676; --line:#D5DBE3;
  --blue:#004A91; --blue-soft:#E3EAF7; --gold:#C9A227; --field:#F7F9FB;
  --plate:#FFFFFF; --plate-ink:#111820;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#0F1622; --panel:#172131; --ink:#E6EBF2; --muted:#9AA6B6; --line:#2A3649;
    --blue:#5B8BE0; --blue-soft:#1C2B45; --gold:#D9B443; --field:#1B2638;
  }
}
:root[data-theme="dark"]{
  --paper:#0F1622; --panel:#172131; --ink:#E6EBF2; --muted:#9AA6B6; --line:#2A3649;
  --blue:#5B8BE0; --blue-soft:#1C2B45; --gold:#D9B443; --field:#1B2638;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--paper);color:var(--ink);font-family:"Barlow",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
.wrap{max-width:1180px;margin:0 auto;padding:24px 20px 48px}
header{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:22px}
.brand{display:flex;align-items:center;gap:12px}
.mark{width:46px;height:46px;border-radius:10px;background:#fff;border:1px solid var(--line);display:grid;place-items:center;flex:none}
.mark img{width:34px;height:auto;display:block}
.brand h1{font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:26px;letter-spacing:.04em;margin:0;line-height:1}
.brand p{margin:2px 0 0;color:var(--muted);font-size:13px}
.grid{display:grid;grid-template-columns:360px 1fr;gap:20px;align-items:start}
.grid>*{min-width:0}
@media (max-width:900px){.grid{grid-template-columns:1fr}}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:20px}
.panel h2{font-size:15px;font-weight:600;margin:0 0 14px}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--field);border:1px solid var(--line);border-radius:8px;padding:3px;margin-bottom:16px}
.seg button{font:inherit;font-weight:600;border:0;background:transparent;color:var(--muted);padding:9px 6px;border-radius:6px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--blue);color:#fff}
.field{margin-bottom:13px}
.field label{display:flex;justify-content:space-between;font-size:13px;font-weight:600;margin-bottom:5px}
.field label span{font-weight:400;color:var(--muted)}
.field input,.field select{width:100%;font:inherit;font-variant-numeric:tabular-nums;color:var(--ink);background:var(--field);border:1px solid var(--line);border-radius:7px;padding:9px 11px}
.field input:focus,.field select:focus,.seg button:focus-visible,.btn:focus-visible{outline:2px solid var(--blue);outline-offset:1px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.derived{display:flex;justify-content:space-between;align-items:baseline;background:var(--blue-soft);border-radius:7px;padding:9px 11px;margin:-3px 0 13px;font-size:13px}
.derived b{font-size:15px;font-variant-numeric:tabular-nums}
.uva-only[hidden]{display:none}
hr{border:0;border-top:1px solid var(--line);margin:16px 0}
.btn{white-space:nowrap;font:inherit;font-weight:600;border:1px solid var(--line);background:var(--panel);color:var(--ink);padding:9px 14px;border-radius:7px;cursor:pointer}
.btn.primary{background:var(--blue);border-color:var(--blue);color:#fff}
.btn[hidden]{display:none}

/* Plate */
.hero{display:grid;grid-template-columns:380px 1fr;gap:24px;align-items:center;margin-bottom:20px}
@media (max-width:640px){.hero{grid-template-columns:1fr}}
[hidden]{display:none!important}
.empty{padding:44px 16px;text-align:center}
.empty p{margin:0;font-size:19px;font-weight:700;color:var(--ink);line-height:1.35}
.empty span{display:block;margin-top:8px;font-size:13.5px;font-weight:400;color:var(--muted)}
@media (max-width:600px){.empty{padding:30px 6px}.empty p{font-size:17px}}
.plate{width:min(100%,380px);aspect-ratio:400/130;background:var(--plate);border:3px solid var(--plate-ink);border-radius:12px;overflow:hidden;display:grid;grid-template-rows:26% 1fr;box-shadow:0 1px 0 rgba(0,0,0,.08)}
.plate-band{background:#004A91;color:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 12px;font-family:"Barlow Condensed",sans-serif;font-weight:600;font-size:clamp(11px,2.6vw,14px);letter-spacing:.12em}
.plate-band i{font-style:normal;display:inline-block;width:16px;height:11px;background:linear-gradient(#74ACDF 0 33%,#fff 33% 66%,#74ACDF 66%);border-radius:1px;vertical-align:middle}
.plate-num{display:flex;align-items:center;justify-content:center;font-family:"Barlow Condensed",sans-serif;font-weight:700;color:var(--plate-ink);font-size:clamp(34px,8vw,54px);letter-spacing:.06em;font-variant-numeric:tabular-nums;line-height:1}
.hero-text .k{font-size:13px;color:var(--muted)}
.hero-text .v{font-size:22px;font-weight:700;font-variant-numeric:tabular-nums}
.hero-text .sub{color:var(--muted);font-size:13px;margin-top:6px;max-width:44ch}

.metrics{display:grid;grid-template-columns:repeat(4,1fr);border:1px solid var(--line);border-radius:10px;overflow:hidden;margin-bottom:20px}
@media (max-width:760px){.metrics{grid-template-columns:repeat(2,1fr)}}
.m{padding:12px 14px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);background:var(--panel)}
.m .k{font-size:12.5px;color:var(--muted)}
.m .v{font-size:19px;font-weight:700;font-variant-numeric:tabular-nums;margin-top:2px}
.m .h{font-size:12px;color:var(--muted)}
.m.key .v{color:var(--blue)}

.tablehead{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px;flex-wrap:wrap}
.tablehead h2{margin:0}
.scroll{overflow-x:auto;border:1px solid var(--line);border-radius:10px;max-height:520px;overflow-y:auto}
table{border-collapse:collapse;width:100%;min-width:640px;font-variant-numeric:tabular-nums;font-size:13.5px}
th{position:sticky;top:0;background:var(--blue);color:#fff;font-weight:600;text-align:right;padding:9px 12px;white-space:nowrap}
th:first-child,td:first-child{text-align:center}
td{padding:7px 12px;text-align:right;border-top:1px solid var(--line);white-space:nowrap;background:var(--panel)}
tbody tr:nth-child(even) td{background:var(--field)}
tfoot td{font-weight:700;background:var(--blue-soft)!important;position:sticky;bottom:0}
.note{font-size:12.5px;color:var(--muted);margin-top:12px;max-width:90ch}
.toast{font-size:13px;color:var(--muted)}
.actions{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.linkbtn{display:block;margin:10px auto 0;font:inherit;font-size:12.5px;color:var(--muted);background:none;border:0;padding:4px;cursor:pointer;text-decoration:underline}
.linkbtn:focus-visible{outline:2px solid var(--blue);outline-offset:1px}
.cfgmsg{font-size:12.5px;color:var(--muted);margin:10px 0 0}
.cfgmsg.err{color:#C0392B}
.field input[aria-invalid="true"]{border-color:#C0392B}
@media (max-width:600px){
  .wrap{padding:14px 12px 32px}
  .panel{padding:16px 14px}
  .field input,.field select{font-size:16px;padding:11px 12px}
  .brand h1{font-size:22px}
  .hero{gap:14px}
  .plate{width:100%}
  .m .v{font-size:17px}
  .tablehead{flex-direction:column;align-items:stretch}
  .actions{display:grid;grid-template-columns:1fr 1fr}
  .actions .toast{grid-column:1/-1;order:3}
  .btn{padding:12px 14px}
  table{font-size:12.5px;min-width:560px}
  th,td{padding:7px 9px}
  th:first-child,td:first-child{position:sticky;left:0;z-index:1}
  th:first-child{z-index:2}
  .scroll{max-height:none}
}
@media (prefers-reduced-motion:no-preference){.plate-num{transition:opacity .15s}}
</style>
</head>

<script>
const $=id=>document.getElementById(id);
/* ===== VALORES DE RESPALDO — se usan solo si no se puede leer la tasa ===== */
const CFG_DEF={ tnaFija:80, tnaUVA:54.9, iva:21, uva0:2120.30 };
const API="/api/tasa";                 // el código de acceso vive en Vercel, no acá
/* ========================================================================= */
const BASE=36500, NMIN=12, NMAX=36;
const CERO={veh:"0",fin:"0",n:"0",gto:"0"};
let sistema="FIJA", last=null, CFG={...CFG_DEF};

function num(s){ s=String(s).trim().replace(/\s|\$/g,""); if(!s) return NaN;
  if(s.includes(",")) s=s.replace(/\./g,"").replace(",","."); else if((s.match(/\./g)||[]).length>1 || /^\d{1,3}(\.\d{3})+$/.test(s)) s=s.replace(/\./g,"");
  return parseFloat(s); }
const fm=(v,d=0)=>isFinite(v)?v.toLocaleString("es-AR",{minimumFractionDigits:d,maximumFractionDigits:d}):"—";
const $f=(v,d=0)=>isFinite(v)?"$ "+fm(v,d):"—";
const pf=(v,d=2)=>isFinite(v)?fm(v*100,d)+" %":"—";

function irr(flows){ // monthly, bisection
  let lo=-0.99,hi=10; const npv=r=>flows.reduce((a,f,i)=>a+f/Math.pow(1+r,i),0);
  if(npv(lo)*npv(hi)>0) return NaN;
  for(let k=0;k<200;k++){const m=(lo+hi)/2; (npv(lo)*npv(m)<=0)?hi=m:lo=m;} return (lo+hi)/2; }

function calc(){
  const veh=num($("veh").value), finP=num($("fin").value), n=Math.round(num($("n").value)), gtoP=num($("gto").value);
  const fin=finP/100, gto=gtoP/100;
  const uva = sistema==="UVA";
  const tna=(uva?CFG.tnaUVA:CFG.tnaFija)/100, iva=CFG.iva/100, uva0=CFG.uva0;
  const cap=veh*fin;
  $("cap").textContent = cap>0? $f(cap) : "—";
  $("tnaOut").textContent = pf(tna)+(uva?" + UVA":"");
  $("uvaOut").textContent = $f(uva0,2);
  const nOk = isFinite(n) && n>=NMIN && n<=NMAX;
  $("n").setAttribute("aria-invalid", (!nOk && isFinite(n) && n>0)?"true":"false");
  const vacio = !(veh>0) && !(finP>0) && !(n>0);
  if(!(cap>0)||!nOk||!(gtoP>=0)||!(tna>=0)||!(iva>=0)||(uva&&!(uva0>0))){
    render(null, vacio? "Cargá los datos del crédito para ver la simulación."
      : (!nOk? `La cantidad de cuotas debe estar entre ${NMIN} y ${NMAX}.` : "Revisá los datos cargados."));
    return; }
  const tem = tna*100*30/BASE;                              // TEM = TNA × 30 / 365 (en UVA: sobre capital en UVA)
  const ppy = BASE/100/30;                                  // períodos por año
  const ie = tem*(1+iva);                                   // tasa con IVA: cuotas iguales con IVA incluido
  const f = ie===0? 1/n : ie/(1-Math.pow(1+ie,-n));
  const capU = uva? cap/uva0 : cap;                          // en UVA o en $
  const cuotaU = capU*f;
  let saldo=capU, rows=[], flowsI=[cap*(1-gto)], flowsS=[cap*(1-gto)], tot={cap:0,int:0,iva:0,cuota:0};
  for(let k=1;k<=n;k++){
    const idx = uva? uva0 : 1;                               // UVA sin proyectar: valor de hoy
    const intU=saldo*tem, ivaU=intU*iva, capK=cuotaU-intU-ivaU; saldo=Math.max(0,saldo-capK);
    const r={k, uvaV:idx, cuotaU, int:intU*idx, cap:capK*idx, saldo:saldo*idx};
    r.iva=r.int*iva; r.cuota=r.cap+r.int+r.iva;
    rows.push(r); flowsI.push(-r.cuota); flowsS.push(-(r.cap+r.int));
    tot.cap+=r.cap; tot.int+=r.int; tot.iva+=r.iva; tot.cuota+=r.cuota;
  }
  const cftI=irr(flowsI), cftS=irr(flowsS);
  last={uva,veh,fin,cap,n,tna,tem,iva,gto,uva0,cuotaU,rows,tot,neto:cap*(1-gto),
    tea:Math.pow(1+tem,ppy)-1, cftI:Math.pow(1+cftI,ppy)-1, cftS:Math.pow(1+cftS,ppy)-1, capU};
  render(last);
}

function vista(vacio){ ["hero","metrics","tablehead","scroll","note"].forEach(id=>$(id).hidden=vacio); $("empty").hidden=!vacio; }
function render(d,msg){
  const th=document.querySelector("#plan thead"), tb=document.querySelector("#plan tbody"), tf=document.querySelector("#plan tfoot");
  if(!d){ vista(true); $("emptyMsg").textContent=msg||"";
    $("plate").textContent="—"; $("neto").textContent="—"; $("heroSub").textContent="";
    $("metrics").innerHTML=""; th.innerHTML=tb.innerHTML=tf.innerHTML=""; $("note").textContent=""; return; }
  vista(false);
  const r1=d.rows[0];
  $("plate").textContent="$ "+fm(r1.cuota);
  $("neto").textContent=$f(d.neto);
  $("heroSub").textContent = d.uva
    ? `Préstamo de ${$f(d.cap)} = ${fm(d.capU,2)} UVA. ${d.n} cuotas iguales de ${fm(d.cuotaU,2)} UVA con IVA incluido, que se pagan al valor UVA de cada vencimiento.`
    : `Préstamo de ${$f(d.cap)} en ${d.n} cuotas iguales con IVA incluido.`;
  const M=[
    ["TEM", pf(d.tem), d.uva?"Sobre capital en UVA":"Tasa efectiva mensual"],
    ["TEA", pf(d.tea), d.uva?"Sobre UVA":"Tasa efectiva anual"],
    ["CFT con IVA", pf(d.cftI), d.uva?"Anual, más variación UVA":"Costo financiero total", true],
    ["CFT sin IVA", pf(d.cftS), "Incluye gastos de otorgamiento"],
    ["Total a devolver", $f(d.tot.cuota), d.uva?"A valor UVA de hoy":"Suma de cuotas con IVA"],
    ["Intereses", $f(d.tot.int), "Sin IVA"],
    ["IVA", $f(d.tot.iva), "Sobre intereses"],
    ["Gastos al otorgar", $f(d.cap*d.gto), "Se descuentan del capital"],
  ];
  $("metrics").innerHTML=M.map(([k,v,h,key])=>`<div class="m${key?" key":""}"><div class="k">${k}</div><div class="v">${v}</div><div class="h">${h}</div></div>`).join("");
  const cols = d.uva? ["Cuota","Saldo en UVA","Cuota en UVA (c/IVA)","Saldo capital","Capital","Interés","IVA","Valor cuota"]
                    : ["Cuota","Saldo capital","Capital","Interés","IVA","Valor cuota"];
  th.innerHTML="<tr>"+cols.map(c=>`<th scope="col">${c}</th>`).join("")+"</tr>";
  tb.innerHTML=d.rows.map(r=>"<tr>"+[r.k, ...(d.uva?[fm(r.saldo/d.uva0,2),fm(r.cuotaU,2)]:[]), $f(r.saldo),$f(r.cap),$f(r.int),$f(r.iva),$f(r.cuota)].map(v=>`<td>${v}</td>`).join("")+"</tr>").join("");
  tf.innerHTML="<tr>"+["Total",...(d.uva?["",""]:[]),"",$f(d.tot.cap),$f(d.tot.int),$f(d.tot.iva),$f(d.tot.cuota)].map(v=>`<td>${v}</td>`).join("")+"</tr>";
  const SEG="El valor de la cuota no incluye el seguro de vida ni el seguro sobre la unidad. Ambos están a cargo del deudor, vencen en la misma fecha que la cuota y se informan antes de su vencimiento.";
  const LEGAL="Simulación de carácter orientativo. No constituye oferta ni compromiso de otorgamiento; sujeta a evaluación crediticia y a las condiciones vigentes al momento de la solicitud.";
  $("note").textContent = SEG+" "+LEGAL+" "+(d.uva
    ? `Importes en pesos al valor UVA de hoy (${$f(d.uva0,2)}), sin proyectar. Cada cuota se paga al valor UVA publicado por el BCRA el día del vencimiento. La TEA y el CFT se suman a la variación de la UVA.`
    : "Cuotas iguales en pesos, con IVA sobre intereses incluido.");
}

function setSistema(s){ sistema=s; $("bUVA").setAttribute("aria-pressed",s==="UVA"); $("bFija").setAttribute("aria-pressed",s!=="UVA");
  document.querySelectorAll(".uva-only").forEach(e=>e.hidden = s!=="UVA");
  $("tnaLab").textContent = s==="UVA"?"TNA sobre UVA":"TNA aplicada"; calc(); }
$("bUVA").onclick=()=>setSistema("UVA"); $("bFija").onclick=()=>setSistema("FIJA");
["veh","fin","n","gto"].forEach(id=>$(id).addEventListener("input",calc));
$("veh").addEventListener("blur",e=>{const v=num(e.target.value); if(isFinite(v)) e.target.value=fm(v);});
$("reset").onclick=()=>{Object.entries(CERO).forEach(([k,v])=>$(k).value=v); calc(); $("veh").focus();};

/* Tasa compartida */
const desdeApi=j=>({tnaFija:+j.tna_fija, tnaUVA:+j.tna_uva, iva:+j.iva, uva0:+j.uva0});
function cfgFill(){ $("tnaF").value=fm(CFG.tnaFija,2); $("tnaU").value=fm(CFG.tnaUVA,2); $("ivaC").value=fm(CFG.iva,2); $("uvaC").value=fm(CFG.uva0,2); }
function cfgMsg(t,err){ $("cfgMsg2").textContent=t; $("cfgMsg2").className="cfgmsg"+(err?" err":""); }

async function cargarTasa(){
  try{
    const c=new AbortController(), t=setTimeout(()=>c.abort(),6000);
    const r=await fetch(API,{signal:c.signal,cache:"no-store"}); clearTimeout(t);
    if(!r.ok) return;
    const v=desdeApi(await r.json());
    if(v.tnaFija>=0 && v.tnaUVA>=0 && v.iva>=0 && v.uva0>0){ CFG=v; calc(); }
  }catch(e){}
}

$("cfgOpen").onclick=()=>{ $("cfgBox").hidden=false; cfgFill(); $("cfgKey").value="";
  cfgMsg("El cambio se aplica a todos los que abran el simulador."); $("tnaF").focus(); };
$("cfgClose").onclick=()=>{ $("cfgBox").hidden=true; };
$("cfgReset").onclick=()=>{ cfgFill(); cfgMsg("Se volvió a los valores vigentes."); };

$("cfgSave").onclick=async ()=>{
  const v={tna_fija:num($("tnaF").value), tna_uva:num($("tnaU").value), iva:num($("ivaC").value), uva0:num($("uvaC").value)};
  if(!(v.tna_fija>=0)||!(v.tna_uva>=0)||!(v.iva>=0)||!(v.uva0>0)) return cfgMsg("Hay un valor inválido.",true);
  const codigo=$("cfgKey").value.trim();
  if(!codigo) return cfgMsg("Ingresá el código de acceso.",true);
  $("cfgSave").disabled=true; cfgMsg("Guardando…");
  try{
    const r=await fetch(API,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({...v,codigo})});
    const j=await r.json().catch(()=>({}));
    if(r.ok){ CFG=desdeApi(j); calc(); cfgFill(); $("cfgKey").value="";
      cfgMsg("Guardado. Lo verán todos al abrir o recargar el simulador."); }
    else cfgMsg(j.error||"No se pudo guardar.",true);
  }catch(e){ cfgMsg("No se pudo conectar con el servidor.",true); }
  $("cfgSave").disabled=false;
};

async function saveFile(name,blob,label){
  $("toast").textContent="";
  let dl=null;
  if(window.claude&&window.claude.use){ try{ dl=await window.claude.use("downloads"); }catch(e){} }
  if(dl){
    try{ await dl.save({filename:name,data:blob}); $("toast").textContent=label+" descargado"; }
    catch(e){ if(e&&e.code==="declined") return; $("toast").textContent = e&&e.code==="rate_limited" ? "Esperá un momento y probá de nuevo." : "La descarga no está disponible en esta vista."; }
    return;
  }
  const url=URL.createObjectURL(blob), a=document.createElement("a");
  a.href=url; a.download=name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),4000);
}
function exportar(){
  if(!last||typeof XLSX==="undefined"){ $("toast").textContent="No se pudo generar el Excel. Recargá la página."; return; }
  const d=last, wb=XLSX.utils.book_new();
  const res=[["AUTOLOGROS · Simulación de crédito prendario"],[],
    ["Sistema",d.uva?"UVA":"Tasa fija"],["Capital",d.cap],["Cuotas",d.n],["TNA"+(d.uva?" sobre UVA":""),d.tna],
    ...(d.uva?[["Valor UVA utilizado",d.uva0],["Capital en UVA",d.capU],["Cuota en UVA (con IVA)",d.cuotaU]]:[]),
    ["IVA s/interés",d.iva],["Gastos de otorgamiento",d.gto],["Neto recibido",d.neto],[],
    ["TEM",d.tem],["TEA",d.tea],["CFT con IVA",d.cftI],["CFT sin IVA",d.cftS],["Total a devolver",d.tot.cuota]];
  XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(res),"Resumen");
  const head=d.uva?["Cuota","Saldo en UVA","Cuota en UVA (c/IVA)","Saldo capital","Capital","Interés","IVA","Valor cuota"]:["Cuota","Saldo capital","Capital","Interés","IVA","Valor cuota"];
  const body=d.rows.map(r=>[r.k,...(d.uva?[r.saldo/d.uva0,r.cuotaU]:[]),r.saldo,r.cap,r.int,r.iva,r.cuota]);
  XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet([head,...body]),"Plan de cuotas");
  const buf=XLSX.write(wb,{bookType:"xlsx",type:"array"});
  saveFile("AUTOLOGROS_simulacion.xlsx",new Blob([buf],{type:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"}),"Excel");
}
setSistema("FIJA");

function exportarPDF(){
  if(!last||!window.jspdf){ $("toast").textContent="No se pudo generar el PDF. Recargá la página."; return; }
  const d=last, {jsPDF}=window.jspdf, doc=new jsPDF({unit:"mm",format:"a4"});
  const W=210, M=14, NAVY=[0,74,145], SKY=[0,162,229], INK=[22,32,46], MUT=[91,102,118];
  const P=(v,dd=0)=>"$ "+fm(v,dd), PC=v=>fm(v*100,2)+" %";
  const hoy=new Date().toLocaleDateString("es-AR",{day:"2-digit",month:"2-digit",year:"numeric"});
  // header
  doc.setFillColor(...NAVY); doc.rect(0,0,W,30,"F");
  doc.setFillColor(255,255,255); doc.roundedRect(M,6,18,18,2.5,2.5,"F");
  try{ doc.addImage($("logo").src,"PNG",M+2.2,8.3,13.6,13.1); }catch(e){}
  doc.setTextColor(255,255,255); doc.setFont("helvetica","bold"); doc.setFontSize(18); doc.text("AUTOLOGROS",M+23,14.5);
  doc.setFont("helvetica","normal"); doc.setFontSize(10); doc.text("Simulación de crédito prendario",M+23,20.5);
  doc.setFontSize(9); doc.text("Fecha: "+hoy,W-M,14.5,{align:"right"}); doc.text("Sistema francés · "+(d.uva?"UVA":"Tasa fija"),W-M,20.5,{align:"right"});
  doc.setFillColor(...SKY); doc.rect(0,30,W,1.2,"F");
  // highlight
  let y=40;
  doc.setDrawColor(213,219,227); doc.setFillColor(243,246,250); doc.roundedRect(M,y,W-2*M,22,2,2,"FD");
  const box=(x,lab,val)=>{ doc.setTextColor(...MUT); doc.setFont("helvetica","normal"); doc.setFontSize(8.5); doc.text(lab,x,y+8);
    doc.setTextColor(...INK); doc.setFont("helvetica","bold"); doc.setFontSize(13); doc.text(val,x,y+16); };
  const cw=(W-2*M)/3;
  box(M+6,"Monto del préstamo",P(d.cap)); box(M+6+cw,d.uva?"Cuota mensual (valor UVA hoy)":"Cuota mensual (IVA incluido)",P(d.rows[0].cuota,2)); box(M+6+2*cw,"Cantidad de cuotas",String(d.n));
  y+=30;
  // parameters and rates, two columns
  const left=[["Valor del vehículo",P(d.veh)],["Porcentaje financiado",fm(d.fin*100,1)+" %"],["Capital del préstamo",P(d.cap)],
    ["Gastos de otorgamiento ("+fm(d.gto*100,2)+" %)",P(d.cap*d.gto)],["Neto a recibir",P(d.neto)],
    ...(d.uva?[["Valor UVA utilizado",P(d.uva0,2)],["Capital en UVA",fm(d.capU,2)+" UVA"],["Cuota en UVA (c/IVA)",fm(d.cuotaU,2)+" UVA"]]:[])];
  const right=[[d.uva?"TNA sobre UVA":"TNA",PC(d.tna)],["TEM",PC(d.tem)],["TEA",PC(d.tea)],["CFT con IVA",PC(d.cftI)],["CFT sin IVA",PC(d.cftS)],
    ["IVA sobre intereses",fm(d.iva*100,1)+" %"],["Total de intereses",P(d.tot.int)],["Total a devolver",P(d.tot.cuota)]];
  const opt={theme:"plain",styles:{fontSize:9,cellPadding:{top:1.6,bottom:1.6,left:2,right:2},textColor:INK},
    columnStyles:{0:{textColor:MUT},1:{halign:"right",fontStyle:"bold"}},
    didDrawCell:c=>{ if(c.section==="body"){ doc.setDrawColor(226,231,238); doc.setLineWidth(0.2); doc.line(c.cell.x,c.cell.y+c.cell.height,c.cell.x+c.cell.width,c.cell.y+c.cell.height);} }};
  const half=(W-2*M-8)/2;
  doc.setFont("helvetica","bold"); doc.setFontSize(10.5); doc.setTextColor(...NAVY);
  doc.text("Datos del crédito",M,y); doc.text("Tasas y costos",M+half+8,y);
  doc.autoTable({...opt,body:left,startY:y+2,margin:{left:M,right:W-M-half},tableWidth:half});
  const yL=doc.lastAutoTable.finalY;
  doc.autoTable({...opt,body:right,startY:y+2,margin:{left:M+half+8,right:M},tableWidth:half});
  y=Math.max(yL,doc.lastAutoTable.finalY)+9;
  // plan
  doc.setFont("helvetica","bold"); doc.setFontSize(10.5); doc.setTextColor(...NAVY); doc.text("Plan de cuotas",M,y);
  const head=d.uva?["Cuota","Saldo UVA","Cuota UVA","Saldo capital","Capital","Interés","IVA","Valor cuota"]:["Cuota","Saldo capital","Capital","Interés","IVA","Valor cuota"];
  const body=d.rows.map(r=>[r.k,...(d.uva?[fm(r.saldo/d.uva0,2),fm(r.cuotaU,2)]:[]),P(r.saldo,2),P(r.cap,2),P(r.int,2),P(r.iva,2),P(r.cuota,2)]);
  const foot=[["Total",...(d.uva?["",""]:[]),"",P(d.tot.cap,2),P(d.tot.int,2),P(d.tot.iva,2),P(d.tot.cuota,2)]];
  doc.autoTable({head:[head],body,foot,startY:y+2.5,margin:{left:M,right:M,top:16,bottom:20},theme:"striped",
    styles:{fontSize:d.uva?7.6:8.4,halign:"right",cellPadding:1.6,textColor:INK},
    headStyles:{fillColor:NAVY,textColor:255,halign:"right",fontStyle:"bold"},
    footStyles:{fillColor:[227,234,247],textColor:INK,fontStyle:"bold"},
    alternateRowStyles:{fillColor:[245,247,250]},columnStyles:{0:{halign:"center"}},
    didParseCell:c=>{ if(c.column.index===0) c.cell.styles.halign="center"; },
    showFoot:"lastPage"});
  // footer on every page
  const nota=d.uva
    ? "Importes en pesos calculados al valor UVA utilizado. Cada cuota se abona al valor UVA publicado por el BCRA a la fecha de su vencimiento."
    : "Cuotas iguales en pesos con IVA sobre intereses incluido.";
  const seguros="El valor de la cuota no incluye el seguro de vida ni el seguro sobre la unidad. Ambos están a cargo del deudor, vencen en la misma fecha que la cuota y se informan antes de su vencimiento.";
  const legal="Simulación de carácter orientativo. No constituye oferta ni compromiso de otorgamiento; sujeta a evaluación crediticia y a las condiciones vigentes al momento de la solicitud.";
  const pages=doc.getNumberOfPages();
  for(let i=1;i<=pages;i++){
    doc.setPage(i);
    if(i>1){ doc.setFillColor(...NAVY); doc.rect(0,0,W,9,"F"); doc.setTextColor(255,255,255); doc.setFont("helvetica","bold"); doc.setFontSize(9); doc.text("AUTOLOGROS · Plan de cuotas",M,6); }
    doc.setDrawColor(213,219,227); doc.line(M,280,W-M,280);
    doc.setTextColor(...MUT); doc.setFont("helvetica","normal"); doc.setFontSize(7.2);
    doc.text(doc.splitTextToSize(seguros+" "+nota+" "+legal,W-2*M-22),M,284);
    doc.text("Página "+i+" de "+pages,W-M,284,{align:"right"});
  }
  saveFile("AUTOLOGROS_plan_de_cuotas.pdf",doc.output("blob"),"PDF");
}
$("xls").onclick=exportar;
$("pdf").onclick=exportarPDF;
cargarTasa();
</script>
